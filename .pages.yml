# Configurazione di Pages CMS (https://pagescms.org) — generata da build/cms.py
media:
  - name: immagini
    label: Immagini
    input: assets/img/uploads
    output: /assets/img/uploads
    categories: [image]
    rename: safe
  - name: documenti
    label: Documenti (PDF)
    input: assets/docs
    output: /assets/docs
    extensions: [pdf]
    rename: safe
content:
  - name: pagine
    label: "✨ Pagine (crea e modifica)"
    type: file
    path: content/pagine.json
    format: json
    list: true
    fields:
      - { name: slug, label: "Indirizzo (solo lettere minuscole e trattini, es. eventi-2026)", type: string }
      - { name: menu, label: Mostra nel menu in alto, type: boolean }
      - name: it
        label: "Contenuto in Italiano"
        type: object
        fields:
          - { name: titolo, label: Titolo della pagina, type: string }
          - { name: sottotitolo, label: Sottotitolo, type: string }
          - name: blocchi
            label: Contenuto (aggiungi blocchi)
            type: block
            list: true
            blockKey: tipo
            blocks:
              - name: testo
                label: Testo
                fields:
                  - { name: titolo, label: Titolo (facoltativo), type: string }
                  - { name: testo, label: Testo, type: rich-text, options: { format: html } }
              - name: immagine
                label: Immagine
                fields:
                  - { name: immagine, label: Immagine, type: image, options: { media: immagini } }
                  - { name: didascalia, label: Didascalia, type: string }
              - name: citazione
                label: Citazione
                fields:
                  - { name: testo, label: Citazione, type: text }
                  - { name: autore, label: Autore, type: string }
              - name: elenco
                label: Elenco puntato
                fields:
                  - { name: titolo, label: Titolo (facoltativo), type: string }
                  - { name: voci, label: Voci, type: string, list: true }
              - name: pulsante
                label: Pulsante
                fields:
                  - { name: etichetta, label: Scritta sul pulsante, type: string }
                  - { name: link, label: "Link (es. #manifesto oppure https://...)", type: string }
              - name: video
                label: Video YouTube
                fields:
                  - { name: link, label: Link del video YouTube, type: string }
              - name: file
                label: File da scaricare
                fields:
                  - { name: etichetta, label: Nome del file, type: string }
                  - { name: file, label: File, type: file, options: { media: documenti } }
